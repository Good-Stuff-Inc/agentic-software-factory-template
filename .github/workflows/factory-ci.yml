name: Factory CI

# Type-checks and tests the factory tooling whenever it, the intake skills, the
# Requirements Agent or the enrichment workflow change.

on:
  pull_request:
    paths:
      - '.github/factory/**'
      - '.github/skills/**'
      - '.github/agents/**'
      - '.github/workflows/issue-enrichment.*'
      - '.github/workflows/factory-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .github/factory
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .github/factory/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run build

      - name: Test
        run: npm test
